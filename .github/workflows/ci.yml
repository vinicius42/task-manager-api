name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Create .env.test file
        run: |
          echo "DB_HOST=localhost" > .env.test
          echo "DB_PORT=5433" >> .env.test
          echo "DB_USERNAME=usertest" >> .env.test
          echo "DB_PASSWORD=passwordtest" >> .env.test
          echo "DB_NAME=taskdbtest" >> .env.test
          echo "JWT_SECRET=test-secret" >> .env.test
          echo "POSTGRES_USER=usertest" >> .env.test
          echo "POSTGRES_PASSWORD=passwordtest" >> .env.test
          echo "POSTGRES_DB=taskdbtest" >> .env.test
      - name: Deploy test database with Docker PostgreSQL
        run: docker compose up -d db test
      - name: Show container logs
        run: docker logs $(docker ps -aqf "name=test")
      - name: Wait for PostgreSQL to be ready
        run: |
          until docker exec $(docker ps -qf "name=test") pg_isready -U usertest; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 5
          done
      - name: Run tests
        run: npm run test:e2e